name: 每5天稽核（漏填與異常）

on:
  schedule:
    # 台灣時間 23:00 = UTC 15:00；每月 5/10/15/20/25/30 日觸發，
    # 程式內再以「首次執行日 2026-11-10、距上次滿 5 天」防護，實際約每 5 天一次
    - cron: '0 15 5,10,15,20,25,30 * *'
  workflow_dispatch:
    inputs:
      force:
        description: '略過日期防護，立即稽核（測試用）'
        type: boolean
        default: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 執行稽核並產生報告
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPO: ${{ vars.BACKUP_REPO }}
          AUDIT_START_DATE: '2026-11-10'
          FORCE: ${{ inputs.force }}
        run: node scripts/audit-report.mjs
